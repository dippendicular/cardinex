[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cardinex"
version = "0.1.0"
description = "Mergeable sketches with guaranteed error intervals: semantic GROUP BY over embeddings, HyperLogLog, Count-Min, Bloom."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["cffi>=1.15", "numpy>=1.22"]

[project.optional-dependencies]
http = ["httpx>=0.25"]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/dippendicular/cardinex"

[tool.setuptools]
packages = ["cardinex"]

[tool.setuptools.package-data]
cardinex = ["*.so", "*.dylib", "*.dll"]

[tool.cibuildwheel]
build = "cp39-* cp310-* cp311-* cp312-* cp313-*"
skip = "*-win32 *-manylinux_i686 *-musllinux_i686"
before-build = "bash {project}/../../scripts/build-lib.sh {project}/cardinex"
test-requires = "pytest"
test-command = "pytest {project}/tests"

[tool.cibuildwheel.linux]
before-all = "bash {project}/../../scripts/install-go.sh"
